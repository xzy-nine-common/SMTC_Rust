[package]
name = "smtc_jni"
version = "0.1.0"
edition = "2021"

[lib]
name = "smtc_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Media_Control",
] }

[profile.release]
opt-level = 3
lto       = true
strip     = true